# Git hooks managed by lefthook.
pre-commit:
  parallel: false
  commands:
    01-biome:
      priority: 1
      glob: "*.{ts,tsx,js,jsx,json}"
      exclude:
        - "biome.json"
        - "**/biome.json"
      run: ./node_modules/.bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    02-typecheck-ui:
      priority: 2
      glob: "packages/ui/**"
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        SKIP_ENV_VALIDATION: "true"
      run: bunx turbo typecheck --filter=@sylphx/ui

    03-typecheck-puzzled:
      priority: 3
      glob: "apps/puzzled/**"
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        SKIP_ENV_VALIDATION: "true"
      run: bunx turbo typecheck --filter=@sylphx/puzzled
