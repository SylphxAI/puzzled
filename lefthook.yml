# Git hooks managed by lefthook.
#
# JS tools run from the repo's node_modules via scripts/hooks/node-tool.sh. A worktree without
# node_modules skips them with a warning (exit 0) instead of exiting 127; CI runs the same checks.
pre-commit:
  parallel: false
  commands:
    01-biome:
      priority: 1
      glob: "*.{ts,tsx,js,jsx,json}"
      exclude:
        - "biome.json"
        - "**/biome.json"
      run: scripts/hooks/node-tool.sh biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    02-typecheck-ui:
      priority: 2
      glob: "packages/ui/**"
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        SKIP_ENV_VALIDATION: "true"
      run: scripts/hooks/node-tool.sh turbo typecheck --filter=@sylphx/ui

    03-typecheck-puzzled:
      priority: 3
      glob: "apps/puzzled/**"
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        SKIP_ENV_VALIDATION: "true"
      run: scripts/hooks/node-tool.sh turbo typecheck --filter=@sylphx/puzzled
