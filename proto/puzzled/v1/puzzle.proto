edition = "2024";

package puzzled.v1;

// Proto3 -> Edition 2024 carries identical wire semantics: pin every proto3
// default that moved between representations so the migration is a pure
// edition cutover with no breaking findings and no consumer impact.
option features.field_presence = IMPLICIT;
option features.enum_type = OPEN;
option features.repeated_field_encoding = PACKED;
option features.utf8_validation = VERIFY;
option features.message_encoding = LENGTH_PREFIXED;
option features.json_format = ALLOW;
option features.(pb.cpp).string_type = STRING;

import "google/protobuf/cpp_features.proto";

// PuzzleService: server-authoritative play.
// Solutions never leave the server. Submissions are validated against the
// served puzzle (stored content or deterministic date-seed generation).

message GetPuzzleRequest {
  string game_slug = 1;
  // Practice/seed mode only; daily/archive authority derives the served
  // puzzle from puzzle_id or puzzle_date, never from a client seed.
  int64 seed = 2;
  string difficulty = 3;
}

message GetPuzzleResponse {
  string game_slug = 1;
  int64 seed = 2;
  string difficulty = 3;
  string puzzle_data_json = 4;
  string slice = 6;
  reserved 5; // solution_json removed: solutions never leave the server
}

message GetDailyRequest {
  string game_slug = 1;
  string difficulty = 2;
  string puzzle_id = 3 [features.field_presence = EXPLICIT];
  // Archive reads: YYYY-MM-DD (default = today).
  string puzzle_date = 5 [features.field_presence = EXPLICIT];
  reserved 4; // has_completed removed: completion is server-derived
}

message DailyCompletion {
  string status = 1;
  uint32 score = 2 [features.field_presence = EXPLICIT];
  uint32 attempts = 3 [features.field_presence = EXPLICIT];
  int64 completed_at_ms = 4 [features.field_presence = EXPLICIT];
  // The level the one accepted finish was played at; absent for games without levels.
  string difficulty = 5 [features.field_presence = EXPLICIT];
}

message GetDailyResponse {
  string game_slug = 1;
  uint32 puzzle_number = 2;
  string puzzle_date = 3;
  string puzzle_id = 4 [features.field_presence = EXPLICIT];
  string difficulty = 5;
  bool has_completed = 6;
  bool can_play = 7;
  string mode = 8;
  string slice = 9;
  bool stub = 10;
  string puzzle_data_json = 11;
  // Present only when the request identity has an accepted finish.
  // Details are read from the same Rust-owned game_sessions row as the
  // completion guard; the client never reconstructs a result.
  DailyCompletion completed_session = 12;
}

// One batched read of which games the caller has already finished today.
// The product day (Asia/Hong_Kong) is computed by the server, never sent.
message GetTodayProgressRequest {
  // Game slugs to report on (at most 64). Unknown slugs are rejected.
  repeated string game_slugs = 1;
}

message GameProgress {
  string game_slug = 1;
  bool has_completed = 2;
  // Present only with an accepted finish: the same game_sessions row GetDaily
  // reads. Never carries a puzzle or an answer.
  DailyCompletion completed_session = 3;
}

message GetTodayProgressResponse {
  // Product day (YYYY-MM-DD, Asia/Hong_Kong) the flags describe.
  string day_key = 1;
  // One entry per requested slug, in request order.
  repeated GameProgress games = 2;
}

message SubmitGuessRequest {
  string game_slug = 1;
  string difficulty = 3;
  string status = 4;
  uint32 attempts = 5;
  uint64 time_spent_ms = 6;
  string submission_json = 7;
  // Served-puzzle identity: puzzle_id (stored content) or puzzle_date
  // (YYYY-MM-DD; default = today). The server derives the served puzzle
  // itself; client seeds are never trusted for authority.
  string puzzle_id = 8 [features.field_presence = EXPLICIT];
  string puzzle_date = 9 [features.field_presence = EXPLICIT];
  reserved 2; // seed removed: not an authority input
}

message SubmitGuessResponse {
  bool valid = 1;
  string status = 2;
  uint32 score = 3 [features.field_presence = EXPLICIT];
  string game_slug = 4;
  string error = 6 [features.field_presence = EXPLICIT];
  string slice = 7;
  reserved 5; // seed removed with the request field
  // The answer, sent only once this finish is accepted (the player's one
  // finish for the day), so a result card can show it. Never sent earlier.
  string reveal_json = 8 [features.field_presence = EXPLICIT];
}

// CheckGuess grades one in-game guess against the served puzzle, so the
// client never holds the answer (word-guess, word-groups).
message CheckGuessRequest {
  string game_slug = 1;
  string difficulty = 2;
  string puzzle_id = 3 [features.field_presence = EXPLICIT];
  string puzzle_date = 4 [features.field_presence = EXPLICIT];
  // word-guess: {"word":"crane"}. word-groups: {"words":[4 words],"solved":[category names]}.
  string guess_json = 5;
}

message CheckGuessResponse {
  // word-guess: {"tiles":["correct"|"present"|"absent" x5]}.
  // word-groups: {"correct":bool,"oneAway":bool,"category":{name,words,level}?}.
  string result_json = 1;
}

// ShareResult returns the id the share link carries as `ref` for the signed-in
// or guest player's accepted daily finish, creating it on first call (the result
// screen calls it when it shows, so the share tap needs no round trip). `tap`
// also counts one share. The server reads the finish itself; the client sends
// no result facts.
message ShareResultRequest {
  string game_slug = 1;
  // Product day (YYYY-MM-DD); default = today.
  string puzzle_date = 2 [features.field_presence = EXPLICIT];
  bool tap = 3;
}

message ShareResultResponse {
  string share_id = 1;
}

// GetSharedResult reads one shared result for the public landing page. No
// identity is needed. It carries only what a result card shows: never the
// solution, a grid, or who shared it.
message GetSharedResultRequest {
  string share_id = 1;
}

message GetSharedResultResponse {
  string game_slug = 1;
  string puzzle_date = 2;
  string difficulty = 3;
  string status = 4;
  uint32 attempts = 5;
  uint32 score = 6 [features.field_presence = EXPLICIT];
  uint64 time_spent_ms = 7 [features.field_presence = EXPLICIT];
  // The sharer's streak on the day of a same-day share.
  uint32 streak = 8 [features.field_presence = EXPLICIT];
}

service PuzzleService {
  rpc GetPuzzle(GetPuzzleRequest) returns (GetPuzzleResponse);
  rpc GetDaily(GetDailyRequest) returns (GetDailyResponse);
  rpc GetTodayProgress(GetTodayProgressRequest) returns (GetTodayProgressResponse);
  rpc SubmitGuess(SubmitGuessRequest) returns (SubmitGuessResponse);
  rpc CheckGuess(CheckGuessRequest) returns (CheckGuessResponse);
  rpc ShareResult(ShareResultRequest) returns (ShareResultResponse);
  rpc GetSharedResult(GetSharedResultRequest) returns (GetSharedResultResponse);
}
