edition = "2024";

package puzzled.v1;

// Proto3 -> Edition 2024 carries identical wire semantics: pin every proto3
// default that moved between representations so the migration is a pure
// edition cutover with no breaking findings and no consumer impact.
option features.field_presence = IMPLICIT;
option features.enum_type = OPEN;
option features.repeated_field_encoding = PACKED;
option features.utf8_validation = VERIFY;
option features.message_encoding = LENGTH_PREFIXED;
option features.json_format = ALLOW;
option features.(pb.cpp).string_type = STRING;

import "google/protobuf/cpp_features.proto";

// PreferencesService: durable app-scoped user settings. Identity comes from
// the verified Bearer JWT; the request body never carries a user id.

message Profile {
  string username = 1;
  string bio = 2;
  bool is_public_profile = 3;
  bool compact_mode = 4;
  bool leaderboard_visible = 5;
  string locale = 6;
}

message NotificationPreferences {
  bool push_enabled = 1;
  bool push_daily_reminder = 2;
  bool push_streak_alert = 3;
  bool push_new_games = 4;
  string daily_reminder_time = 5;
  bool email_enabled = 6;
  bool email_weekly_digest = 7;
  bool email_marketing = 8;
}

message GetProfileRequest {}
message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string username = 1 [features.field_presence = EXPLICIT];
  string bio = 2 [features.field_presence = EXPLICIT];
  bool is_public_profile = 3 [features.field_presence = EXPLICIT];
  bool compact_mode = 4 [features.field_presence = EXPLICIT];
  bool leaderboard_visible = 5 [features.field_presence = EXPLICIT];
  string locale = 6 [features.field_presence = EXPLICIT];
}
message UpdateProfileResponse {
  Profile profile = 1;
}

message CheckUsernameRequest {
  string username = 1;
}
message CheckUsernameResponse {
  bool available = 1;
}

message GetNotificationPreferencesRequest {}
message GetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message UpdatePushPreferencesRequest {
  bool push_enabled = 1 [features.field_presence = EXPLICIT];
  bool push_daily_reminder = 2 [features.field_presence = EXPLICIT];
  bool push_streak_alert = 3 [features.field_presence = EXPLICIT];
  bool push_new_games = 4 [features.field_presence = EXPLICIT];
  string daily_reminder_time = 5 [features.field_presence = EXPLICIT];
}
message UpdatePushPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message UpdateEmailPreferencesRequest {
  bool email_enabled = 1 [features.field_presence = EXPLICIT];
  bool email_weekly_digest = 2 [features.field_presence = EXPLICIT];
  bool email_marketing = 3 [features.field_presence = EXPLICIT];
}
message UpdateEmailPreferencesResponse {
  NotificationPreferences preferences = 1;
}

service PreferencesService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc CheckUsername(CheckUsernameRequest) returns (CheckUsernameResponse);
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);
  rpc UpdatePushPreferences(UpdatePushPreferencesRequest) returns (UpdatePushPreferencesResponse);
  rpc UpdateEmailPreferences(UpdateEmailPreferencesRequest) returns (UpdateEmailPreferencesResponse);
}
