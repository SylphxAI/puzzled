edition = "2024";

package puzzled.v1;

// Proto3 -> Edition 2024 carries identical wire semantics: pin every proto3
// default that moved between representations so the migration is a pure
// edition cutover with no breaking findings and no consumer impact.
option features.field_presence = IMPLICIT;
option features.enum_type = OPEN;
option features.repeated_field_encoding = PACKED;
option features.utf8_validation = VERIFY;
option features.message_encoding = LENGTH_PREFIXED;
option features.json_format = ALLOW;
option features.(pb.cpp).string_type = STRING;

import "google/protobuf/cpp_features.proto";

// Stats and leaderboard read contracts (ADR-168 S1).
// HTTP transitional path: GET /api/v1/stats/leaderboard

enum LeaderboardType {
  LEADERBOARD_TYPE_UNSPECIFIED = 0;
  LEADERBOARD_TYPE_STREAK = 1;
  LEADERBOARD_TYPE_SCORE = 2;
}

enum LeaderboardPeriod {
  LEADERBOARD_PERIOD_UNSPECIFIED = 0;
  LEADERBOARD_PERIOD_TODAY = 1;
  LEADERBOARD_PERIOD_WEEK = 2;
  LEADERBOARD_PERIOD_ALL = 3;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_id = 2;
  string user_name = 3 [features.field_presence = EXPLICIT];
  string user_image = 4 [features.field_presence = EXPLICIT];
  int32 value = 5;
}

message GetLeaderboardRequest {
  string game_slug = 1;
  LeaderboardType type = 2;
  LeaderboardPeriod period = 3;
  int32 limit = 4;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}


// Today percentile generated Connect path — parity with GET /api/v1/stats/today-percentile.
message GetTodayPercentileRequest {
  string game_slug = 1;
  string status = 2;
  int32 score = 3 [features.field_presence = EXPLICIT];
  int32 attempts = 4 [features.field_presence = EXPLICIT];
  int32 mistakes = 5 [features.field_presence = EXPLICIT];
  int64 time_spent_ms = 6 [features.field_presence = EXPLICIT];
  // Fixture residual for pure dual-oracle (no DB).
  int32 total_players = 7 [features.field_presence = EXPLICIT];
  int32 better_than = 8 [features.field_presence = EXPLICIT];
}

message GetTodayPercentileResponse {
  int32 percentile = 1 [features.field_presence = EXPLICIT];
  int32 total_players = 2;
  string game_slug = 3;
  string status = 4;
  int32 score = 5 [features.field_presence = EXPLICIT];
  int32 attempts = 6 [features.field_presence = EXPLICIT];
  int32 mistakes = 7 [features.field_presence = EXPLICIT];
  int64 time_spent_ms = 8 [features.field_presence = EXPLICIT];
  bool stub = 9;
  string dispatch = 10;
}

service StatsService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetTodayPercentile(GetTodayPercentileRequest) returns (GetTodayPercentileResponse);
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc GetTodayOverview(GetTodayOverviewRequest) returns (GetTodayOverviewResponse);
}

message GetUserStatsRequest {
  string game_slug = 1;
}

message UserGameStats {
  string game_slug = 1;
  uint32 games_played = 2;
  uint32 games_won = 3;
  uint32 best_score = 4;
}

message GetUserStatsResponse {
  repeated UserGameStats games = 1;
  uint32 total_played = 2;
  uint32 total_won = 3;
}

message GetHistoryRequest {
  string game_slug = 1;
  uint32 limit = 2;
}

message SessionEntry {
  string game_slug = 1;
  string puzzle_id = 2;
  string puzzle_date = 3;
  string status = 4;
  uint32 score = 5;
  uint32 attempts = 6;
  uint64 time_spent_ms = 7;
  string mode = 8;
}

message GetHistoryResponse {
  repeated SessionEntry sessions = 1;
}

message GetTodayOverviewRequest {}

message GameCompletionCount {
  string game_slug = 1;
  uint32 count = 2;
}

message GetTodayOverviewResponse {
  uint32 player_count = 1;
  repeated GameCompletionCount completions = 2;
}
