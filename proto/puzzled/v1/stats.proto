syntax = "proto3";

package puzzled.v1;

// Stats and leaderboard read contracts (ADR-168 S1).

enum LeaderboardType {
  LEADERBOARD_TYPE_UNSPECIFIED = 0;
  LEADERBOARD_TYPE_STREAK = 1;
  LEADERBOARD_TYPE_SCORE = 2;
}

enum LeaderboardPeriod {
  LEADERBOARD_PERIOD_UNSPECIFIED = 0;
  LEADERBOARD_PERIOD_TODAY = 1;
  LEADERBOARD_PERIOD_WEEK = 2;
  LEADERBOARD_PERIOD_ALL = 3;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_id = 2;
  optional string user_name = 3;
  optional string user_image = 4;
  int32 value = 5;
}

message GetLeaderboardRequest {
  string game_slug = 1;
  LeaderboardType type = 2;
  LeaderboardPeriod period = 3;
  int32 limit = 4;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}


// Today percentile generated Connect path.
message GetTodayPercentileRequest {
  string game_slug = 1;
  string status = 2;
  optional int32 score = 3;
  optional int32 attempts = 4;
  optional int32 mistakes = 5;
  optional int64 time_spent_ms = 6;
  // Fixture residual for pure dual-oracle (no DB).
  optional int32 total_players = 7;
  optional int32 better_than = 8;
}

message GetTodayPercentileResponse {
  optional int32 percentile = 1;
  int32 total_players = 2;
  string game_slug = 3;
  string status = 4;
  optional int32 score = 5;
  optional int32 attempts = 6;
  optional int32 mistakes = 7;
  optional int64 time_spent_ms = 8;
  bool stub = 9;
  string dispatch = 10;
}

service StatsService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetTodayPercentile(GetTodayPercentileRequest) returns (GetTodayPercentileResponse);
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc GetTodayOverview(GetTodayOverviewRequest) returns (GetTodayOverviewResponse);
}

message GetUserStatsRequest {
  string game_slug = 1;
}

message UserGameStats {
  string game_slug = 1;
  uint32 games_played = 2;
  uint32 games_won = 3;
  uint32 best_score = 4;
}

message GetUserStatsResponse {
  repeated UserGameStats games = 1;
  uint32 total_played = 2;
  uint32 total_won = 3;
}

message GetHistoryRequest {
  string game_slug = 1;
  uint32 limit = 2;
}

message SessionEntry {
  string game_slug = 1;
  string puzzle_id = 2;
  string puzzle_date = 3;
  string status = 4;
  uint32 score = 5;
  uint32 attempts = 6;
  uint64 time_spent_ms = 7;
  string mode = 8;
}

message GetHistoryResponse {
  repeated SessionEntry sessions = 1;
}

message GetTodayOverviewRequest {}

message GameCompletionCount {
  string game_slug = 1;
  uint32 count = 2;
}

message GetTodayOverviewResponse {
  // Distinct users with a server-accepted puzzle_ritual finish on the current
  // Asia/Hong_Kong product day (daily_puzzle_completers).
  uint32 player_count = 1;
  // Qualifying puzzle_ritual finishes grouped by canonical game slug.
  repeated GameCompletionCount completions = 2;
}
