name: CI

# Optimistic merge (SylphxAI/.github docs/optimistic-merge.md): the merge queue
# and drafts run only the fast gate below; a pull request marked ready also
# runs the affected full suite (verify.yml); verify.yml runs again on main
# after merge and nightly. Ruleset checks keep their names: the seven gate jobs
# named below are what the ruleset requires today, and `ci-ok` aggregates them
# for the day the ruleset requires one check.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: sylphx
  TURBO_API: https://turbo.sylphx.com
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: every job only reads the repository.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  # Stop the line on a red trunk (merge groups only). While the trunk's newest
  # conclusive Verify run is red and its way back is in motion, a merge group is
  # admitted only for a revert, a live-outage fix or a pull request labelled
  # `main-red-fix`. `observe` prints what it would refuse and refuses nothing;
  # switch to `enforce` after a few merge groups have been read.
  main-state:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@05ac6474b96425bcb4965addd025a93e061b66c4 # main 05ac647 (SylphxAI/.github, current handler)
        with:
          mode: observe

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.range.outputs.base }}
      run: ${{ steps.range.outputs.run }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          filter: blob:none

      - id: range
        uses: SylphxAI/.github/.github/actions/ci-range@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          lanes: |
            identifiers:
            lint:
            security:
            web: apps/* packages/* proto/* brand/* package.json bun.lock bunfig.toml turbo.json biome.json buf.yaml buf.gen.yaml scripts/*
            rust: crates/* proto/* Cargo.toml Cargo.lock
            build: apps/* packages/* proto/* crates/* package.json bun.lock Cargo.toml Cargo.lock
            migrations: apps/puzzled/atlas/* apps/puzzled/atlas.hcl crates/puzzled-server/src/*_tests.rs crates/puzzled-server/src/capabilities/preferences/* scripts/check-migration-order*

  # ==========================================
  # Repository Standards
  # ==========================================

  identifiers:
    name: Identifiers
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  # ==========================================
  # Code Quality
  # ==========================================

  lint-and-typecheck:
    name: Lint & Type Check
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # bun 1.3.x --frozen-lockfile false-positives here; committed lock remains authority.
      # Outer retry: fetch-retries does not cover "Fail extracting tarball" (MQ flakes).
      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: Workflow parse
        uses: SylphxAI/.github/.github/actions/workflow-lint@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)

      - name: Run Biome lint
        run: bun run lint
        working-directory: apps/puzzled

      # The brand home is the source of truth for the mark, the icons and the
      # brand colours: fails when a master changed without a rebuild, or when a
      # surface file in public/ stopped being a copy of the brand file.
      - name: Brand home is current (masters, generated files, surface copies)
        run: python3 brand/build.py --check

      - name: Proto contract gate (buf lint + breaking)
        run: bun run check:proto-buf

      # Affected-only: turbo runs the typecheck of the two packages when the
      # change reaches them from the plan base; an empty base runs both.
      - name: Run TypeScript type check
        run: |
          if [ -n "$TURBO_SCM_BASE" ]; then
            bunx turbo typecheck --affected --filter=@sylphx/puzzled --filter=@sylphx/ui --concurrency=1
          else
            bunx turbo typecheck --filter=@sylphx/puzzled --filter=@sylphx/ui --concurrency=1
          fi
        env:
          TURBO_SCM_BASE: ${{ needs.plan.outputs.base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          NODE_OPTIONS: '--max-old-space-size=5120'
          SKIP_ENV_VALIDATION: 'true'

  # ==========================================
  # Security
  # ==========================================

  security:
    name: Security Scan
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Dependency vulnerability audit (shipped dependencies)
        # Fail-closed on high+ advisories in what ships to players. Dev-only
        # tooling (lhci and its browser download chain) is out of scope.
        run: bun audit --audit-level=high --prod

      - name: Secret detection
        # Binary install (not the GH Action docker path): self-hosted
        # sylphx-linux-standard runners may lack a Docker daemon; docker-based
        # trufflehog then exits 125 and blocks required Security Scan + Auto Deploy.
        # Keep fail-closed verified secret scan semantics.
        run: |
          set -euo pipefail
          VER=3.88.33
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) TH_ARCH=amd64 ;;
            aarch64|arm64) TH_ARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${VER}/trufflehog_${VER}_linux_${TH_ARCH}.tar.gz"
          TGZ=/tmp/trufflehog.tgz
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$TGZ" "$URL" \
              && tar -tzf "$TGZ" >/dev/null \
              && tar -xzf "$TGZ" -C /tmp trufflehog; then
              break
            fi
            echo "trufflehog download attempt ${attempt} failed; retrying..."
            rm -f "$TGZ" /tmp/trufflehog
            if [ "$attempt" -eq 5 ]; then
              echo "trufflehog download failed after retries"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          chmod +x /tmp/trufflehog
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          echo "trufflehog scan base=$BASE head=$HEAD"
          /tmp/trufflehog git file://. --since-commit "$BASE" --branch "$HEAD" --only-verified --fail --no-update

  # ==========================================
  # Unit Tests (affected by the change)
  # ==========================================

  unit-tests:
    name: Unit Tests
    needs: plan
    if: fromJSON(needs.plan.outputs.run).web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # bun 1.3.x --frozen-lockfile false-positives here; committed lock remains authority.
      # Outer retry: fetch-retries does not cover "Fail extracting tarball" (MQ flakes).
      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      # bun test has no affected mode: the lane is path-selected (web paths)
      # and runs the whole unit suite when it runs.
      - name: Run unit tests
        run: bun run test:unit
        working-directory: apps/puzzled
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          SKIP_ENV_VALIDATION: 'true'

  # ==========================================
  # Build inputs: the packaging guard and a locked compile check. The
  # production Next.js build and the release binary are verify.yml.
  # ==========================================

  build:
    name: Build
    needs: plan
    if: fromJSON(needs.plan.outputs.run).build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install protoc 36.1 (Edition 2024 floor)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o protoc.zip
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  protoc.zip" | sha256sum -c -
          unzip -qo protoc.zip -d "$HOME/.local"
          test "$("$HOME/.local/bin/protoc" --version)" = "libprotoc 36.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - uses: SylphxAI/.github/.github/actions/rust-sccache@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}

      - name: Dockerfile copies puzzled-core
        run: bash scripts/check-dockerfile-puzzled-core.sh

      - name: Locked compile check
        run: cargo check --locked -p puzzled-core -p puzzled-server

  rust-api:
    name: Rust API
    needs: plan
    if: fromJSON(needs.plan.outputs.run).rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install protoc 36.1 (Edition 2024 floor)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o protoc.zip
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  protoc.zip" | sha256sum -c -
          unzip -qo protoc.zip -d "$HOME/.local"
          test "$("$HOME/.local/bin/protoc" --version)" = "libprotoc 36.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - uses: SylphxAI/.github/.github/actions/rust-sccache@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}

      # One workspace of two crates; the server depends on core, so both run.
      # Database-backed tests skip here (no PUZZLED_TEST_DATABASE_URL); the
      # migrations lane and verify.yml run them.
      - name: cargo fmt
        run: cargo fmt -p puzzled-core -p puzzled-server -- --check

      - name: cargo clippy
        run: cargo clippy -p puzzled-core -p puzzled-server -- -D warnings -A clippy::double_parens -A clippy::too_many_arguments

      - name: cargo test (unit, no database)
        run: cargo test -p puzzled-core -p puzzled-server --lib --bins

  # ==========================================
  # Database Migrations: exercised before they reach main, because DDL cannot
  # be undone by a revert. Integrity (atlas.sum), then the database-backed
  # tests that apply every migration to a scratch Postgres.
  # ==========================================

  migrations:
    name: Migration Integrity
    needs: plan
    if: fromJSON(needs.plan.outputs.run).migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUZZLED_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Migration versions are free and in order
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          env -u PR_NUMBER -u GH_REPO -u GH_TOKEN bash scripts/check-migration-order.test.sh
          if [ "$EVENT" = pull_request ]; then
            export MIGRATION_BASE="$PR_BASE"
          else
            export MIGRATION_BASE="$QUEUE_BASE"
            unset PR_NUMBER
          fi
          scripts/check-migration-order.sh apps/puzzled/atlas/migrations

      - name: No job selects a billed runner
        run: bash .github/scripts/check-ci-runner-profile.sh

      - name: Setup Atlas
        run: |
          mkdir -p /tmp/atlas-bin
          curl -sL "https://atlasbinaries.com/atlas/atlas-linux-amd64-latest" \
            -o /tmp/atlas-bin/atlas
          chmod +x /tmp/atlas-bin/atlas
          echo "/tmp/atlas-bin" >> "$GITHUB_PATH"
          /tmp/atlas-bin/atlas version

      - name: Verify migration checksums
        run: |
          DIR="apps/puzzled/atlas/migrations"
          echo "Checking $DIR..."
          /tmp/atlas-bin/atlas migrate hash --dir "file://$DIR" 2>&1

          if git diff --name-only HEAD | grep -q "$DIR/atlas.sum"; then
            echo "✖ atlas.sum is stale — run 'bun run atlas:hash' in apps/puzzled and commit"
            exit 1
          fi
          echo "✓ Migration checksums OK"

      - name: Verify no uncommitted migrations
        run: |
          if git status --porcelain | grep -E "atlas/migrations/.*\.sql$|atlas\.sum"; then
            echo "ERROR: Uncommitted migration files detected!"
            exit 1
          fi
          echo "✓ All migrations committed"

      # Our runners cannot run `services:` containers, so this is a host-native
      # scratch server with a job-private data dir and port.
      - name: Start scratch Postgres
        run: |
          set -euo pipefail
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql
          fi
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          PGDATA="${RUNNER_TEMP}/pg-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          PGPORT="$((20000 + RANDOM % 20000))"
          rm -rf "${PGDATA}"
          LC_ALL=C "${PG_BIN}/initdb" -D "${PGDATA}" -U postgres --auth=trust --locale=C -E UTF8 >/dev/null
          LC_ALL=C "${PG_BIN}/pg_ctl" -D "${PGDATA}" -w -l "${PGDATA}.log" \
            -o "-p ${PGPORT} -k ${RUNNER_TEMP} -c listen_addresses=127.0.0.1" start
          echo "PUZZLED_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${PGPORT}/postgres" >> "$GITHUB_ENV"

      - name: Install protoc 36.1 (Edition 2024 floor)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o protoc.zip
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  protoc.zip" | sha256sum -c -
          unzip -qo protoc.zip -d "$HOME/.local"
          test "$("$HOME/.local/bin/protoc" --version)" = "libprotoc 36.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - uses: SylphxAI/.github/.github/actions/rust-sccache@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}

      # The tests that apply apps/puzzled/atlas/migrations to a throwaway
      # database (billing flow, result shares, account erasure, push ownership)
      # and the one that parses every table for player-id columns.
      - name: Migration-backed tests
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/puzzled-migration-backed-tests.log"
          CARGO_TERM_COLOR=never cargo test -p puzzled-server --lib -- billing_flow_tests result_shares_tests account_erasure_tests account_deletion retention_push_tests guest_ownership_tests today_progress_tests | tee "$LOG"
          # Fail closed if a renamed filter selects nothing, or if the actual
          # two-user HTTP ownership regression was not exercised.
          grep -Eq '^test guest_ownership_tests::unsigned_ids_and_forged_internal_headers_cannot_read_or_adopt \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::issued_cookie_is_fresh_host_only_and_progress_adopts_without_deleting_collisions \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::freeze_failure_rolls_back_adoption_and_keeps_credential_live \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::private_access_lease_serializes_adoption_and_revocation \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::issuance_rejects_origin_ambiguity_without_database_effects \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::allocation_collision_never_aliases_existing_account_or_guest \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::second_guest_cookie_never_reads_or_adopts_a_public_player_id \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::existing_cookie_parallel_bootstrap_keeps_one_registry_player \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::legacy_guest_write_and_completion_paths_have_no_player_effects \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::bootstrap_is_zero_database_and_unknown_read_does_not_allocate \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::four_concurrent_submits_with_two_connections_do_not_hold_pool_during_content_lookup \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::fifty_parallel_first_write_pairs_keep_one_winning_namespace_each \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::account_erasure_includes_retained_adopted_guest_collisions_and_provenance \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::raced_adoption_and_erasure_preserve_only_unclaimed_guest_or_erase_linked_sources \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::unregistered_guess_budget_uses_hash_without_allocating_player \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::invalid_submit_rolls_back_allocation_and_adoption_until_valid_finish \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::legacy_claim_keeps_streak_and_history_and_leaves_nothing_under_legacy \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::replaying_the_legacy_id_with_another_token_claims_nothing \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::account_backed_or_registered_legacy_id_is_refused \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::two_concurrent_legacy_claims_have_exactly_one_winner \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::wrong_origin_legacy_claim_is_forbidden_without_database_effect \.\.\. ok$' "$LOG"
          grep -Eq '^test guest_ownership_tests::signed_in_player_with_legacy_id_ends_with_history_on_the_account \.\.\. ok$' "$LOG"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$LOG"
          grep -Eq '^test retention_push_tests::connect_push_foreign_endpoint_returns_404_without_any_writes \.\.\. ok$' "$LOG"

  # The full suite on a ready pull request; never in a merge group or a draft.
  suite:
    name: Suite
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  # Not required today (the ruleset names the seven jobs above); the single
  # check to require once the ruleset is reduced to one.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [main-state, plan, identifiers, lint-and-typecheck, security, unit-tests, build, rust-api, migrations, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          needs: ${{ toJSON(needs) }}
          required: plan
