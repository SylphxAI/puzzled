name: CI

# Agent-Native Queued Trunk:
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - merge_group required for Merge Queue admission
# - Concurrency cancels superseded PR/branch tip runs

on:
  merge_group:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sylphx.toml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: sylphx
  TURBO_API: https://turbo.sylphx.com
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

concurrency:
  # Queued Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Code Quality
  # ==========================================

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: sylphx-linux-standard
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # bun 1.3.x --frozen-lockfile false-positives here; committed lock remains authority.
      # Outer retry: fetch-retries does not cover "Fail extracting tarball" (MQ flakes).
      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: Run Biome lint
        run: bun run lint
        working-directory: apps/puzzled

      - name: Proto contract gate (buf lint + breaking)
        run: bun run check:proto-buf

      - name: Platform boundary fence
        run: bash scripts/check-platform-boundary.sh .

      - name: Run TypeScript type check
        run: bunx turbo typecheck --filter=@sylphx/puzzled --filter=@sylphx/ui --concurrency=1
        env:
          NODE_OPTIONS: '--max-old-space-size=5120'
          SKIP_ENV_VALIDATION: 'true'

  # ==========================================
  # Security
  # ==========================================

  security:
    name: Security Scan
    runs-on: sylphx-linux-standard
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Dependency vulnerability audit
        # Report high+ vulns but do not block product security PRs on pre-existing
        # transitive debt; secret detection below remains fail-closed.
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Secret detection
        # Binary install (not the GH Action docker path): self-hosted
        # sylphx-linux-standard runners may lack a Docker daemon; docker-based
        # trufflehog then exits 125 and blocks required Security Scan + Auto Deploy.
        # Keep fail-closed verified secret scan semantics.
        run: |
          set -euo pipefail
          VER=3.88.33
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) TH_ARCH=amd64 ;;
            aarch64|arm64) TH_ARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${VER}/trufflehog_${VER}_linux_${TH_ARCH}.tar.gz"
          TGZ=/tmp/trufflehog.tgz
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "$TGZ" "$URL" \
              && tar -tzf "$TGZ" >/dev/null \
              && tar -xzf "$TGZ" -C /tmp trufflehog; then
              break
            fi
            echo "trufflehog download attempt ${attempt} failed; retrying..."
            rm -f "$TGZ" /tmp/trufflehog
            if [ "$attempt" -eq 5 ]; then
              echo "trufflehog download failed after retries"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          chmod +x /tmp/trufflehog
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          echo "trufflehog scan base=$BASE head=$HEAD"
          /tmp/trufflehog git file://. --since-commit "$BASE" --branch "$HEAD" --only-verified --fail --no-update

  # ==========================================
  # Database Migrations
  # ==========================================

  migrations:
    name: Migration Integrity
    runs-on: sylphx-linux-standard
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Atlas
        run: |
          mkdir -p /tmp/atlas-bin
          curl -sL "https://atlasbinaries.com/atlas/atlas-linux-amd64-latest" \
            -o /tmp/atlas-bin/atlas
          chmod +x /tmp/atlas-bin/atlas
          echo "/tmp/atlas-bin" >> "$GITHUB_PATH"
          /tmp/atlas-bin/atlas version

      - name: Verify migration checksums
        run: |
          DIR="apps/puzzled/atlas/migrations"
          echo "Checking $DIR..."
          /tmp/atlas-bin/atlas migrate hash --dir "file://$DIR" 2>&1

          if git diff --name-only HEAD | grep -q "$DIR/atlas.sum"; then
            echo "✖ atlas.sum is stale — run 'bun run atlas:hash' in apps/puzzled and commit"
            exit 1
          fi
          echo "✓ Migration checksums OK"

      - name: Verify no uncommitted migrations
        run: |
          if git status --porcelain | grep -E "atlas/migrations/.*\.sql$|atlas\.sum"; then
            echo "ERROR: Uncommitted migration files detected!"
            exit 1
          fi
          echo "✓ All migrations committed"

  # ==========================================
  # Unit Tests
  # ==========================================

  unit-tests:
    name: Unit Tests
    runs-on: sylphx-linux-standard
    timeout-minutes: 20
    needs: [lint-and-typecheck]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: Run unit tests
        run: bun run test:unit
        working-directory: apps/puzzled
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          SKIP_ENV_VALIDATION: 'true'


  # ==========================================
  # Build Validation
  # ==========================================

  build:
    name: Build
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    needs: [lint-and-typecheck, migrations, unit-tests]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: Build web (next build, typecheck enforced)
        run: bun run build
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production

      - name: GET / document returns HTML while Connect hangs
        run: node scripts/assert-document-route.mjs
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Build Rust api binary (locked release)
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          fi
          cargo build --locked --release -p puzzled-server
  rust-api:
    name: Rust API
    runs-on: sylphx-linux-standard
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install protoc
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          fi
          protoc --version
      - name: cargo fmt
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo fmt -p puzzled-core -p puzzled-server -- --check

      - name: cargo clippy
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo clippy -p puzzled-core -p puzzled-server -- -D warnings -A clippy::double_parens -A clippy::too_many_arguments

      - name: cargo test
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo test -p puzzled-core -p puzzled-server
