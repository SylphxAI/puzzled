# Post-merge verification (optimistic merge, SylphxAI/.github
# docs/optimistic-merge.md): everything the gate dropped - the production web
# build, the release binary, the full database-backed Rust suite and the
# served-build harnesses - runs here on each push to main, manually via
# dispatch, and on a pull request marked ready (ci.yml calls this file). The
# `verified` job is the marker the platform's Release reads.
name: Verify

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run:
        description: Resolved lane JSON from the calling fast gate; empty computes a range.
        type: string
        default: ""
      lanes:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated lanes to run. Empty runs every lane the range selects.
        type: string
        default: ""

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: sylphx
  TURBO_API: https://turbo.sylphx.com
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  plan:
    if: inputs.run == ''
    name: Plan
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
    timeout-minutes: 10
    outputs:
      base: ${{ steps.range.outputs.base }}
      run: ${{ steps.range.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none

      - id: range
        uses: SylphxAI/.github/.github/actions/ci-range@821eafc6aa821e29d8292273c6548566495970c4
        with:
          only: ${{ inputs.lanes }}
          global-patterns: ''
          lanes: |
            build: apps/puzzled/src/* apps/puzzled/tests/* apps/puzzled/e2e-tests/* apps/puzzled/scripts/* apps/puzzled/public/* apps/puzzled/*.ts apps/puzzled/*.json apps/puzzled/*.mjs apps/puzzled/*.cjs apps/puzzled/*.css apps/puzzled/bunfig.toml apps/puzzled/Dockerfile packages/* proto/* brand/* config/commercial/* package.json bun.lock bunfig.toml turbo.json biome.json buf.yaml buf.gen.yaml scripts/* .github/workflows/ci.yml .github/workflows/verify.yml
            rust: crates/* proto/* Cargo.toml Cargo.lock rust-toolchain* .cargo/* apps/puzzled/atlas/* apps/puzzled/atlas.hcl scripts/check-dockerfile-puzzled-core.sh scripts/check-migration-order* .github/workflows/ci.yml .github/workflows/verify.yml
            browser: apps/puzzled/playwright.config.ts apps/puzzled/e2e-tests/* apps/puzzled/scripts/serve-puzzle-fixture.ts scripts/ci-contract.test.ts package.json apps/puzzled/package.json bun.lock .github/workflows/ci.yml .github/workflows/verify.yml

  build:
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    name: Build (Next.js)
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    needs: plan
    if: always() && !cancelled() && (inputs.run != '' || needs.plan.result == 'success') && fromJSON(inputs.run || needs.plan.outputs.run || '{}').build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: Build web (next build, typecheck enforced)
        run: bun run build
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg

      # The one web build: the SEO, a11y and Lighthouse harnesses serve this
      # artifact instead of each running next build again.
      # Tarred, not uploaded as a tree: Turbopack links external server
      # packages as symlinks under .next/node_modules, and an artifact upload
      # would copy them away from their dependencies.
      - name: Pack the web build
        run: tar -C apps/puzzled --exclude=.next/cache --exclude=.next/standalone -cf web-build.tar .next

      - name: Checksum the web build
        run: sha256sum web-build.tar > web-build.tar.sha256

      - name: Stage the web build handoff
        run: |
          mkdir web-build-handoff
          mv web-build.tar web-build.tar.sha256 web-build-handoff/

      - name: run-store put web-build
        uses: SylphxAI/.github/.github/actions/run-store@90d88da2d60dcd6a3884899c273dd3a7f975be17
        with:
          mode: put
          name: web-build
          path: web-build-handoff

      - name: GET / document returns HTML while Connect hangs
        run: node scripts/assert-document-route.mjs
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production


  rust-api:
    name: Rust API (full, database-backed)
    needs: plan
    if: always() && !cancelled() && (inputs.run != '' || needs.plan.result == 'success') && fromJSON(inputs.run || needs.plan.outputs.run || '{}').rust
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    env:
      PUZZLED_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Postgres for the Puzzled Plus flow test (buy, unlock, family, cancel,
      # refund); it creates its own throwaway database. Our runners cannot run
      # `services:` containers, so this is a host-native scratch server with a
      # job-private data dir and port.
      - name: Start scratch Postgres
        run: |
          set -euo pipefail
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql
          fi
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          PGDATA="${RUNNER_TEMP}/pg-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          PGPORT="$((20000 + RANDOM % 20000))"
          rm -rf "${PGDATA}"
          LC_ALL=C "${PG_BIN}/initdb" -D "${PGDATA}" -U postgres --auth=trust --locale=C -E UTF8 >/dev/null
          LC_ALL=C "${PG_BIN}/pg_ctl" -D "${PGDATA}" -w -l "${PGDATA}.log" \
            -o "-p ${PGPORT} -k ${RUNNER_TEMP} -c listen_addresses=127.0.0.1" start
          echo "PUZZLED_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:${PGPORT}/postgres" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Put cargo on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - uses: SylphxAI/.github/.github/actions/rust-sccache@af0cb3e5ed20701ab32265b990174cf3c9de91f5 # SylphxAI/.github main (optimistic-merge template)
        with:
          s3-access-key: ${{ secrets.SYLPHX_CI_CACHE_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SYLPHX_CI_CACHE_SECRET_KEY }}

      - name: Install protoc
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o protoc.zip
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  protoc.zip" | sha256sum -c -
          unzip -qo protoc.zip -d "$HOME/.local"
          test "$("$HOME/.local/bin/protoc" --version)" = "libprotoc 36.1"
          export PATH="$HOME/.local/bin:${PATH}"
          export PROTOC="$HOME/.local/bin/protoc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$HOME/.local/bin/protoc" >> "$GITHUB_ENV"
          protoc --version
      - name: Dockerfile copies puzzled-core
        run: bash scripts/check-dockerfile-puzzled-core.sh

      - name: Build Rust api binary (locked release)
        run: cargo build --locked --release -p puzzled-server

      - name: cargo fmt
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo fmt -p puzzled-core -p puzzled-server -- --check

      - name: cargo clippy
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo clippy --locked -p puzzled-core -p puzzled-server -- -D warnings -A clippy::double_parens -A clippy::too_many_arguments

      - name: cargo test
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${PATH}"
          cargo test --locked -p puzzled-core -p puzzled-server

  seo-contract:
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    name: SEO Contract
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    needs: [plan, build]
    if: always() && !cancelled() && needs.build.result == 'success' && fromJSON(inputs.run || needs.plan.outputs.run || '{}').build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      - name: run-store get web-build
        uses: SylphxAI/.github/.github/actions/run-store@90d88da2d60dcd6a3884899c273dd3a7f975be17
        with:
          mode: get
          name: web-build
          path: .

      - name: Verify the web build checksum
        run: sha256sum -c web-build.tar.sha256

      - name: Unpack the web build
        run: tar -C apps/puzzled -xf web-build.tar

      # apps/puzzled/scripts/seo-verify.ts asserts crawler truth against a
      # served build, so the job serves one instead of measuring source.
      - name: Serve the build on :3014
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg
        run: |
          set -euo pipefail
          bun run start -p 3014 > "$RUNNER_TEMP/serve-seo.log" 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o "$RUNNER_TEMP/probe.html" -w '%{http_code}' http://localhost:3014/ || true)"
            if [ "$status" = "200" ]; then
              echo "served build answered 200 on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "served build never answered 200 (last status ${status:-none})"
          cat "$RUNNER_TEMP/serve-seo.log"
          exit 1

      - name: SEO contract harness (bun run verify:seo)
        working-directory: apps/puzzled
        run: bun run verify:seo --base http://localhost:3014

      # Every public page, every served locale: no raw message key and the html
      # lang the URL names. The catalogue guards read files; this reads pages.
      - name: Locale harness (bun run verify:locale)
        working-directory: apps/puzzled
        run: bun run verify:locale --base http://localhost:3014

      - name: Show the server log
        if: failure()
        run: if [ -f "$RUNNER_TEMP/serve-seo.log" ]; then cat "$RUNNER_TEMP/serve-seo.log"; fi

      - name: Stop the served build
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then kill "$SERVE_PID" 2>/dev/null || :; fi

  a11y:
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    name: Accessibility (WCAG 2.2 AA)
    # Browser infrastructure changes are verified before merge as well as on trunk.
    if: always() && !cancelled() && needs.build.result == 'success' && fromJSON(inputs.run || needs.plan.outputs.run || '{}').build && (github.event_name != 'pull_request' || fromJSON(inputs.run || needs.plan.outputs.run || '{}').browser)
    runs-on: sylphx-linux-standard
    timeout-minutes: 40
    needs: [plan, build]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the Playwright browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-a11y" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      # The suite drives a real Chromium; nothing on the runner image is
      # assumed. Pinned by the @playwright/test version in bun.lock.
      - name: Install Playwright Chromium
        working-directory: apps/puzzled
        run: bunx playwright install --with-deps chromium

      - name: run-store get web-build
        uses: SylphxAI/.github/.github/actions/run-store@90d88da2d60dcd6a3884899c273dd3a7f975be17
        with:
          mode: get
          name: web-build
          path: .

      - name: Verify the web build checksum
        run: sha256sum -c web-build.tar.sha256

      - name: Unpack the web build
        run: tar -C apps/puzzled -xf web-build.tar

      - name: Serve the build on :3015
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg
        run: |
          set -euo pipefail
          bun run start -p 3015 > "$RUNNER_TEMP/serve-a11y.log" 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o "$RUNNER_TEMP/probe.html" -w '%{http_code}' http://localhost:3015/ || true)"
            if [ "$status" = "200" ]; then
              echo "served build answered 200 on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "served build never answered 200 (last status ${status:-none})"
          cat "$RUNNER_TEMP/serve-a11y.log"
          exit 1

      # Actions sets CI=true, so playwright.config.ts deliberately leaves its
      # webServer undefined: this job owns the server and points the suite at
      # it with BASE_URL. Never retry this gate: quarantine flaky assertions
      # with an owned exit criterion instead of turning a red attempt green.
      - name: WCAG 2.2 A/AA suite (bun run test:a11y)
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3015
        run: bun run test:a11y --retries=0

      - name: Sudoku authoritative terminal regression
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3015
        run: bun run test:e2e e2e-tests/sudoku-terminal.e2e.ts e2e-tests/result-modal-consent.e2e.ts --workers=1 --retries=0

      - name: Discovery structured data, catalog and statutory disclosures
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3015
        run: bun run test:e2e e2e-tests/discovery.e2e.ts e2e-tests/llms.e2e.ts --workers=1 --retries=0

      - name: Stage the Playwright report
        id: playwright-report
        if: always() && hashFiles('apps/puzzled/playwright-report/**', 'apps/puzzled/test-results/**') != ''
        run: |
          set -euo pipefail
          bundle="$(mktemp -d "$RUNNER_TEMP/playwright-report.XXXXXXXX")"
          for dir in apps/puzzled/playwright-report apps/puzzled/test-results; do
            if [ -d "$dir" ]; then cp -R -- "$dir" "$bundle/"; fi
          done
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Store the Playwright report
        if: always() && steps.playwright-report.outputs.path != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d
        with:
          mode: put
          name: a11y-playwright-report
          path: ${{ steps.playwright-report.outputs.path }}
          retention-days: 1

      - name: Stop the served build
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then kill "$SERVE_PID" 2>/dev/null || :; fi

  lighthouse:
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    name: Lighthouse Budgets
    # Match the a11y acceptance lane, including browser infrastructure PRs.
    if: always() && !cancelled() && needs.build.result == 'success' && fromJSON(inputs.run || needs.plan.outputs.run || '{}').build && (github.event_name != 'pull_request' || fromJSON(inputs.run || needs.plan.outputs.run || '{}').browser)
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    needs: [plan, build]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner does not keep Playwright's browser cache under
      # $HOME/.cache/ms-playwright, so pin one path for this job: letting the
      # install below and the CHROME_PATH lookup after it resolve their own
      # defaults is how they end up disagreeing.
      - name: Pin the Playwright browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-lighthouse" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      # chromium-launcher (used by lhci) resolves CHROME_PATH first, then the
      # image. Install the Playwright build so the browser is pinned by
      # bun.lock instead of by whatever the runner happens to ship.
      - name: Install Chromium for Lighthouse
        working-directory: apps/puzzled
        run: bunx playwright install --with-deps chromium

      - name: Point CHROME_PATH at that Chromium
        run: |
          set -euo pipefail
          # The full Chromium build, not the headless shell: lhci launches
          # Chrome with its own flags and needs a real browser binary.
          bin="$(bun -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$bin"
          "$bin" --version
          echo "CHROME_PATH=$bin" >> "$GITHUB_ENV"

      - name: run-store get web-build
        uses: SylphxAI/.github/.github/actions/run-store@90d88da2d60dcd6a3884899c273dd3a7f975be17
        with:
          mode: get
          name: web-build
          path: .

      - name: Verify the web build checksum
        run: sha256sum -c web-build.tar.sha256

      - name: Unpack the web build
        run: tar -C apps/puzzled -xf web-build.tar

      # apps/puzzled/lighthouserc.json is used unchanged: the mobile profile
      # (Lighthouse mobile defaults with applied/devtools throttling — switched
      # from lantern simulation on 2026-09-21 after it floored at ~3.2 s LCP on
      # the lightest route; analysis in this PR) over / and the module
      # pages /games/word-search, /games/nonogram and /games/arithmo — slugs
      # outside the free rotation, so the anonymous render branch is the same
      # every day — at the S5 budgets: performance >= 0.9, LCP <= 2500 ms,
      # CLS <= 0.1, TBT <= 300 ms, FCP <= 2500 ms (raised from 2000 ms: under
      # applied throttling FCP and LCP land on the same banner paint at ~2.0 s,
      # inside run-to-run noise) and speed index <= 3000 ms, all at error.
      # Both browser harnesses need a real board, not the API-error fallback.
      # Serve the same frozen boards as the unit fixtures; no account or write.
      - name: Start fixture GetDaily API
        if: always()
        working-directory: apps/puzzled
        run: |
          set -euo pipefail
          bun scripts/serve-puzzle-fixture.ts > "$RUNNER_TEMP/puzzle-fixture.log" 2>&1 &
          echo "FIXTURE_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 -X POST \
              -H 'content-type: application/json' -H 'connect-protocol-version: 1' \
              --data '{"gameSlug":"word-search","difficulty":""}' \
              http://127.0.0.1:8787/puzzled.v1.PuzzleService/GetDaily \
              > "$RUNNER_TEMP/puzzle-fixture-ready.json" 2>/dev/null; then
              node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(d.gameSlug!=="word-search"||d.canPlay!==true||typeof d.puzzleDataJson!=="string"||d.puzzleDataJson.length<10)process.exit(1)' \
                "$RUNNER_TEMP/puzzle-fixture-ready.json"
              echo "API_INTERNAL_URL=http://127.0.0.1:8787" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/puzzle-fixture.log"
          exit 1

      # lhci starts `bun run start` itself on port 3000; timing assertions run post-merge only.
      - name: Lighthouse budget (bun run lighthouse)
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg
        run: bun run lighthouse

      # Seeded-play field-metric gate: five routes, the puzzle API answered from
      # a fixed seed, real taps and key presses, LCP and INP read from the
      # browser's own entries; the p75 per route is checked against the
      # budgets (LCP 2500 ms, INP 600 ms ratcheting to 200 ms) and written to the
      # job summary. Lighthouse only estimates INP (as TBT); this measures it.
      - name: Serve the build on :3016
        if: always()
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg
        run: |
          set -euo pipefail
          bun run start -p 3016 > "$RUNNER_TEMP/serve-vitals.log" 2>&1 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3016/ || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/serve-vitals.log"
          exit 1

      # always(): a Lighthouse miss must not hide the vitals table.
      - name: Web vitals budget, seeded play (bun run test:vitals)
        if: always()
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3016
        run: bun run test:vitals

      - name: Stop the served build
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then kill "$SERVE_PID" 2>/dev/null || :; fi
          if [ -n "${FIXTURE_API_PID:-}" ]; then kill "$FIXTURE_API_PID" 2>/dev/null || :; fi

      # After the server is stopped, so a failed vitals run still publishes
      # the table. A missing report is not a failure: the test writes it only
      # when it reaches the assertion.
      - name: Store the web vitals report
        if: always() && hashFiles('apps/puzzled/test-results/web-vitals/**') != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d
        with:
          mode: put
          name: web-vitals-report
          path: apps/puzzled/test-results/web-vitals
          retention-days: 1

      - name: Store the Lighthouse report
        if: always() && hashFiles('apps/puzzled/.lighthouseci/**') != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d
        with:
          mode: put
          name: lighthouse-report
          path: apps/puzzled/.lighthouseci
          retention-days: 1

  craft:
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    name: Fixture craft (board, home, phone, pricing)
    # Match the a11y acceptance lane, including browser infrastructure PRs.
    if: always() && !cancelled() && needs.build.result == 'success' && fromJSON(inputs.run || needs.plan.outputs.run || '{}').build && (github.event_name != 'pull_request' || fromJSON(inputs.run || needs.plan.outputs.run || '{}').browser)
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    needs: [plan, build]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the Playwright browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-craft" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Cache bun modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: bun install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if bun install --frozen-lockfile --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000; then
              exit 0
            fi
            echo "bun install attempt ${attempt} failed; clearing partial cache and retrying..."
            rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.bun/install/cache
            sleep $((attempt * 3))
          done
          echo "bun install failed after retries"
          exit 1

      # Pinned by the @playwright/test version in bun.lock. phone-first runs the
      # iPhone 13 device profile, which Playwright drives on WebKit, so the
      # job installs both engines.
      - name: Install Playwright Chromium and WebKit
        working-directory: apps/puzzled
        run: bunx playwright install --with-deps chromium webkit

      - name: run-store get web-build
        uses: SylphxAI/.github/.github/actions/run-store@90d88da2d60dcd6a3884899c273dd3a7f975be17
        with:
          mode: get
          name: web-build
          path: .

      - name: Verify the web build checksum
        run: sha256sum -c web-build.tar.sha256

      - name: Unpack the web build
        run: tar -C apps/puzzled -xf web-build.tar

      # The specs need a real board, not the API-error fallback, and no write:
      # each web server reads the frozen boards from its own fixture GetDaily
      # API. The pricing spec needs the catalogue price list open, and an open
      # store locks every game but the free one for guests, which is not the
      # state the board and home specs run in, so that pair is a second fixture
      # and server.
      - name: Start the fixture APIs and the served builds
        working-directory: apps/puzzled
        env:
          SKIP_ENV_VALIDATION: 'true'
          NODE_ENV: production
          SYLPHX_PUBLIC_URL: https://puzzled.gg
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/craft.pids"
          start_pair() { # name fixture_port web_port open_plans
            FIXTURE_API_PORT="$2" FIXTURE_OPEN_PLANS="$4" bun scripts/serve-puzzle-fixture.ts > "$RUNNER_TEMP/fixture-$1.log" 2>&1 &
            echo "$!" >> "$RUNNER_TEMP/craft.pids"
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 "http://127.0.0.1:$2/healthz" > /dev/null 2>&1; then break; fi
              if [ "$attempt" = 30 ]; then cat "$RUNNER_TEMP/fixture-$1.log"; exit 1; fi
              sleep 1
            done
            API_INTERNAL_URL="http://127.0.0.1:$2" bun run start -p "$3" > "$RUNNER_TEMP/serve-$1.log" 2>&1 &
            echo "$!" >> "$RUNNER_TEMP/craft.pids"
            for attempt in $(seq 1 60); do
              status="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$3/" || true)"
              if [ "$status" = "200" ]; then echo "$1 build answered 200 on attempt ${attempt}"; return 0; fi
              sleep 2
            done
            echo "$1 build never answered 200 (last status ${status:-none})"
            cat "$RUNNER_TEMP/serve-$1.log"
            exit 1
          }
          start_pair board 8787 3017 0
          start_pair pricing 8788 3018 1
          # An open store is what keeps the pricing spec from skipping.
          curl -fsS --max-time 5 -X POST -H 'content-type: application/json' -H 'connect-protocol-version: 1' --data '{}' \
            http://127.0.0.1:8788/puzzled.v1.BillingService/ListPlans | grep -q '"salesOpen":true'

      # A skipped test is a silent pass, so any skip fails the step.
      # Each run keeps its own report and output folders: Playwright clears
      # them at the start of a run, so a shared folder would let the pricing run
      # erase the traces and screenshots of the board run's failure.
      - name: Board, home and phone-first craft
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3017
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/board
        run: |
          set -euo pipefail
          bun run test:e2e e2e-tests/board-craft.e2e.ts e2e-tests/home-craft.e2e.ts e2e-tests/phone-first.e2e.ts --workers=1 --retries=0 --output=test-results/board 2>&1 | tee "$RUNNER_TEMP/craft-board.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/craft-board.log"; then echo "a craft spec skipped"; exit 1; fi

      - name: Pricing with the open store
        if: always()
        working-directory: apps/puzzled
        env:
          BASE_URL: http://localhost:3018
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pricing
        run: |
          set -euo pipefail
          bun run test:e2e e2e-tests/pricing.e2e.ts --workers=1 --retries=0 --output=test-results/pricing 2>&1 | tee "$RUNNER_TEMP/craft-pricing.log"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/craft-pricing.log"; then echo "a pricing test skipped"; exit 1; fi

      - name: Stop the served builds and fixture APIs
        if: always()
        run: |
          while read -r pid; do kill "$pid" 2>/dev/null || :; done < "$RUNNER_TEMP/craft.pids"

      - name: Stage the Playwright report
        id: playwright-report
        if: always() && hashFiles('apps/puzzled/playwright-report/**', 'apps/puzzled/test-results/**') != ''
        run: |
          set -euo pipefail
          bundle="$(mktemp -d "$RUNNER_TEMP/playwright-report.XXXXXXXX")"
          for dir in apps/puzzled/playwright-report apps/puzzled/test-results; do
            if [ -d "$dir" ]; then cp -R -- "$dir" "$bundle/"; fi
          done
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Store the Playwright report
        if: always() && steps.playwright-report.outputs.path != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d
        with:
          mode: put
          name: craft-playwright-report
          path: ${{ steps.playwright-report.outputs.path }}
          retention-days: 1

  # The marker: named exactly `verified`; never a required check.
  verified:
    name: verified
    if: always()
    needs: [plan, build, rust-api, seo-contract, a11y, lighthouse, craft]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 5
    steps:
      - if: ${{ !cancelled() }}
        uses: SylphxAI/.github/.github/actions/needs-pass@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          needs: ${{ toJSON(needs) }}
          required: |
            ${{ inputs.run == '' && 'plan' || '' }},
            ${{ fromJSON(inputs.run || needs.plan.outputs.run || '{}').build && 'build,seo-contract' || '' }},
            ${{ fromJSON(inputs.run || needs.plan.outputs.run || '{}').rust && 'rust-api' || '' }},
            ${{ (fromJSON(inputs.run || needs.plan.outputs.run || '{}').build && (github.event_name != 'pull_request' || fromJSON(inputs.run || needs.plan.outputs.run || '{}').browser)) && 'a11y,lighthouse,craft' || '' }}
      - name: Cancellation is not a passing verdict
        if: cancelled()
        run: exit 1
