# optimistic-merge: advisory — Scheduled default-branch dependency advisory audit; never gates PRs or merge groups.
name: Dependency audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency vulnerability audit
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-standard' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Dependency vulnerability audit (shipped dependencies)
        run: bun audit --audit-level=high --prod
