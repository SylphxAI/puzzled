# optimistic-merge: advisory — Standalone required migration-guard ruleset check; evaluated independently from ci-ok.
# optimistic-merge: gate-external
name: Migration Guard

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-guard:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'sylphx-linux-control' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ${{ github.event.repository.visibility == 'public' && 'blob:none' || '' }}
          persist-credentials: false
      - uses: SylphxAI/.github/.github/actions/migration-guard@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          dialect: postgres
          migration-directories: |
            apps/puzzled/atlas/migrations
