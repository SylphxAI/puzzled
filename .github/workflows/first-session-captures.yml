# optimistic-merge: advisory — Nonblocking first-session parity screenshot capture; never gates PRs or merge groups.
name: First-session captures
on:
  pull_request:
    paths:
      - scripts/capture-first-session.ts
      - .github/workflows/first-session-captures.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: Served before origin
        default: https://puzzled.gg
        type: string
      preview_url:
        description: Optional public HTTPS preview origin
        type: string
      capture_nyt:
        description: Include NYT reference entry pages
        type: boolean
        default: true
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capture:
    permissions:
      contents: read
      id-token: write
    # Reference captures are public-only; execution remains self-hosted.
    if: github.event.repository.private == false
    runs-on: sylphx-linux-standard
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the Playwright browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-captures" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun scripts/capture-first-session.ts
        env:
          BASE_URL: ${{ inputs.base_url || 'https://puzzled.gg' }}
          PREVIEW_URL: ${{ inputs.preview_url }}
          CAPTURE_NYT: ${{ github.event_name == 'pull_request' || inputs.capture_nyt }}
      - name: Store first-session captures
        if: always() && hashFiles('artifacts/first-session/**') != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d
        with:
          mode: put
          name: first-session-${{ github.run_id }}
          path: artifacts/first-session
          retention-days: 1
