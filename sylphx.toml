version = "1"

[project]
name = "puzzled-monorepo"

[build]
strategy = "dockerfile"
dockerfile = "apps/puzzled/Dockerfile"
context = "."

[ci]
# PR previews are admitted (ADR-170 deploy-layer proof); project policy,
# labels, and capacity gates still apply on the platform side.
preview_deploys = true

[[services]]
name = "web"
type = "web"
port = 3000
# ADR-5140: presentation is web. Platform injects API_INTERNAL_URL for private
# web → api calls (connect graph). The web service has no backend authority.
connect = { services = ["api"] }
release_command = "atlas migrate apply --env production --baseline 20260222000000"

# Rust owns the product API (sole backend). Next.js owns presentation only.
[[services]]
name = "api"
type = "web"
port = 8080
# Complete public API namespace routes to Rust; no dual backend remains.
path_prefixes = [
  "/puzzled.v1.AdminService",
  "/puzzled.v1.GamificationService",
  "/puzzled.v1.HealthService",
  "/puzzled.v1.JobsService",
  "/puzzled.v1.PreferencesService",
  "/puzzled.v1.PuzzleService",
  "/puzzled.v1.StatsService",
  "/healthz",
  "/readyz",
]
# Platform cron callbacks target the api JobsService (retention jobs); the web
# residual executor is deleted (ADR-170).
watch_paths = [
  "crates/puzzled-server/**",
  "crates/puzzled-core/**",
  "Cargo.toml",
  "Cargo.lock",
  "sylphx.toml",
]

[services.health]
mode = "http"
# ADR-141 single path.
path = "/healthz"

[services.build]
strategy = "dockerfile"
dockerfile = "crates/puzzled-server/Dockerfile"
context = "."
