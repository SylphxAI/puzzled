version = "1"

[project]
name = "puzzled-monorepo"

[build]
strategy = "dockerfile"
dockerfile = "apps/puzzled/Dockerfile"
context = "."

[ci]
# PR previews are admitted (ADR-170 deploy-layer proof); project policy,
# labels, and capacity gates still apply on the platform side.
preview_deploys = true
merge = "optimistic"
on_red = "revert"

# Project-level schema gate (ADR-089 / DEPLOY-GUIDE). Ephemeral Job runs once
# per push BEFORE writer services roll. Supersedes web-only release_command:
# web runtime image has no atlas binary, so api-only crate deploys left
# migration 20260812010000 unapplied on live tip 626f40a.
#
# image=api: atlas + migrations are baked into crates/puzzled-server/Dockerfile
# (no third build-only worker service — dens counted migrator against readiness).
[database.migrations]
engine = "atlas"
dir = "apps/puzzled/atlas/migrations"
image = "api"
# Pure atlas argv only (Platform migration gate rejects shell wrappers).
# Empty databases execute the baseline DDL; managed databases resume from their ledger.
# Unmanaged populated databases still require an explicit lifecycle-owner decision.
command = "atlas migrate apply --dir file:///app/apps/puzzled/atlas/migrations --url $MIGRATOR_DATABASE_URL --revisions-schema public"
timeout = "10m"
watch_paths = [
  "apps/puzzled/atlas/migrations/**",
  "apps/puzzled/atlas.hcl",
  "crates/puzzled-server/Dockerfile",
  "sylphx.toml",
]

# Runtime values for every service in the environment. Only top-level [env]
# literals reach the runtime; a per-service table of values is not delivered.
# Browser origin verified against the live production web/api route binding.
[env.PUZZLED_PUBLIC_URL]
value = "https://puzzled.gg"

# Admin allow-list (workaround, docs/capabilities.md PUZ-AUTH-ADMIN): comma-separated
# exact Sylphx Auth subjects (principal.subject) that are Puzzled admins. Empty means
# nobody. Remove when cloud#11587 serves an organization{roles} claim and admin becomes
# the "admin" role on Puzzled's Auth organization. Never log this value.
[env.PUZZLED_ADMIN_PRINCIPALS]
value = ""

# Reverse trial (docs/monetization.md): after a player's third finished day the
# api opens every game for 7 days, once per account. On together with Plus
# sales; set "off" to stop new grants (running trials end on their own date).
[env.PUZZLED_REVERSE_TRIAL]
value = "on"

[[services]]
name = "web"
instance_type = "micro"
port = 3000
# Readiness answers from the Next.js process and calls nothing. Probing "/"
# rendered the home page (about 20 api reads) every 5 seconds.
health = { path = "/api/health" }
# ADR-5140: presentation is web. Platform injects API_INTERNAL_URL for private
# web → api calls (connect graph). The web service has no backend authority
# and must boot without DATABASE_URL / REDIS_URL / SYLPHX_SECRET_KEY
# (api owns Postgres/KV; ADR-3418 strips the Platform root secret without
# an explicit BaaS binding).
connect = { services = ["api"] }
# Schema apply is [database.migrations] only — no dual residual release_command.

# Rust owns the product API (sole backend). Next.js owns presentation only.
[[services]]
name = "api"
instance_type = "nano"
port = 8080
# Complete public API namespace routes to Rust; no dual backend remains.
path_prefixes = [
  "/v1/guest/session",
  "/puzzled.v1.AdminService",
  "/puzzled.v1.BillingService",
  "/puzzled.v1.GamificationService",
  "/puzzled.v1.HealthService",
  "/puzzled.v1.JobsService",
  "/puzzled.v1.PreferencesService",
  "/puzzled.v1.PuzzleService",
  "/puzzled.v1.StatsService",
  "/healthz",
  "/readyz",
  # Key-guarded production check for error capture (docs/observability.md).
  # The web service's own trigger is /api/observability/test.
  "/observability/test",
]
# Platform cron callbacks target the api JobsService (retention jobs); the web
# residual executor is deleted (ADR-170).
watch_paths = [
  "crates/puzzled-server/**",
  "crates/puzzled-core/**",
  "apps/puzzled/atlas/migrations/**",
  "Cargo.toml",
  "Cargo.lock",
  "sylphx.toml",
]

# Dedicated email-link verification key; the web route needs only API_INTERNAL_URL.
[services.env.EMAIL_UNSUBSCRIBE_SECRET]
from_secret = "EMAIL_UNSUBSCRIBE_SECRET"

[services.env.SYLPHX_MONEY_API_KEY]
from_secret = "SYLPHX_MONEY_API_KEY"

[services.health]
mode = "http"
# ADR-141 single path (api). Web uses per-service health.path = "/".
path = "/readyz"
liveness_path = "/healthz"

[services.build]
strategy = "dockerfile"
dockerfile = "crates/puzzled-server/Dockerfile"
context = "."

# Scheduled work (Compute). Each tick carries Compute's signed receipt for its
# exact URL, verified against Compute's published keys
# (crates/puzzled-server/src/shared/tick_receipt.rs); no shared secret.
#
# Daily puzzles (#246): store every game's puzzle 14 days ahead and backfill
# the 30-day archive; a low buffer alerts. The api also runs this at start-up.
[[compute.schedules]]
id = "puzzled-daily-puzzles"
idempotency_key = "puzzled-daily-puzzles-v1"
service = "api"
path = "/internal/compute/daily-puzzles"
calendar = { kind = "cron", expression = "7 * * * *", timezone = "UTC" }
overlap = "skip"
catch_up = "last_only"
target = { kind = "http", method = "POST", signed = true }
retry = { max_attempts = 3 }
pause = false

# Audit-log retention: IPs stripped after 30 days, rows deleted after a year.
[[compute.schedules]]
id = "puzzled-audit-log-retention"
idempotency_key = "puzzled-audit-log-retention-v1"
service = "api"
path = "/internal/compute/audit-log-retention"
calendar = { kind = "cron", expression = "23 3 * * *", timezone = "UTC" }
overlap = "skip"
catch_up = "skip"
target = { kind = "http", method = "POST", signed = true }
retry = { max_attempts = 3 }
pause = false

# Daily reminders: every quarter hour, send the push whose owner's own reminder
# time (in their own time zone) has just come; a player gets one per local day.
[[compute.schedules]]
id = "puzzled-daily-reminders"
idempotency_key = "puzzled-daily-reminders-v1"
service = "api"
path = "/internal/compute/daily-reminders"
calendar = { kind = "cron", expression = "*/15 * * * *", timezone = "UTC" }
overlap = "skip"
catch_up = "skip"
target = { kind = "http", method = "POST", signed = true }
retry = { max_attempts = 3 }
pause = false

# Tryit conversions: retry sign-ups and purchases not yet reported to Tryit.
[[compute.schedules]]
id = "puzzled-tryit-conversions"
idempotency_key = "puzzled-tryit-conversions-v1"
service = "api"
path = "/internal/compute/tryit-conversions"
calendar = { kind = "cron", expression = "3,13,23,33,43,53 * * * *", timezone = "UTC" }
overlap = "skip"
catch_up = "last_only"
target = { kind = "http", method = "POST", signed = true }
retry = { max_attempts = 3 }
pause = false

# Operator job (Workflows WFL-JOB): erase one person by their Sylphx Auth
# subject. Runs the api's live Release image with the api's own env and secret
# bindings (database URL, Money and Auth keys); nothing else holds them. No
# schedule and no default args: an operator starts it and names a subject.
# Same erase path as the in-app deletion (Money rule, then the rows and Auth's
# deletion in one transaction). The supported recovery when an in-app erasure
# may have deleted the sign-in but its rows did not commit (the person cannot
# sign in to retry); safe to repeat. Prints counts only.
#   sylphx jobs run erase-player -- --dry-run --subject <auth subject>
#   sylphx jobs run erase-player -- --subject <auth subject>
[[jobs]]
name = "erase-player"
service = "api"
command = ["puzzled-server", "erase-player"]
timeout = "10m"
retries = 0
concurrency = "forbid"
