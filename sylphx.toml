version = "1"

[project]
name = "puzzled-monorepo"

[build]
strategy = "dockerfile"
dockerfile = "apps/puzzled/Dockerfile"
context = "."

[ci]
# PR previews are admitted (ADR-170 deploy-layer proof); project policy,
# labels, and capacity gates still apply on the platform side.
preview_deploys = true

# Project-level schema gate (ADR-089 / DEPLOY-GUIDE). Ephemeral Job runs once
# per push BEFORE writer services roll. Supersedes web-only release_command:
# web runtime image has no atlas binary, so api-only crate deploys left
# migration 20260812010000 unapplied on live tip 626f40a.
#
# image=api: atlas + migrations are baked into crates/puzzled-server/Dockerfile
# (no third build-only worker service — dens counted migrator against readiness).
[database.migrations]
engine = "atlas"
dir = "apps/puzzled/atlas/migrations"
image = "api"
# Pure atlas argv only (Platform migration gate rejects shell wrappers).
command = "atlas migrate apply --dir file:///app/apps/puzzled/atlas/migrations --url $MIGRATOR_DATABASE_URL --revisions-schema public --baseline 20260222000000"
timeout = "10m"
watch_paths = [
  "apps/puzzled/atlas/migrations/**",
  "apps/puzzled/atlas.hcl",
  "crates/puzzled-server/Dockerfile",
  "sylphx.toml",
]

[[services]]
name = "web"
type = "web"
port = 3000
# dens STZ: env Production already has enable_scale_to_zero=true. Manifest
# keys are SSOT — without them tip recovery strips management-set STZ and
# leaves dual classic+ksvc NotOwned residual (live 2026-08-12 puzzled-prod).
min_instances = 0
max_instances = 1
scale_to_zero = true
idle_timeout_seconds = 300
# Presentation root is HTTP-ready for Knative readiness (no separate /health).
health = { path = "/" }
# ADR-5140: presentation is web. Platform injects API_INTERNAL_URL for private
# web → api calls (connect graph). The web service has no backend authority.
connect = { services = ["api"] }
# Schema apply is [database.migrations] only — no dual residual release_command.

# Rust owns the product API (sole backend). Next.js owns presentation only.
[[services]]
name = "api"
type = "web"
port = 8080
# dens STZ: durable with env enable_scale_to_zero (parity tryit/viral).
min_instances = 0
max_instances = 1
scale_to_zero = true
idle_timeout_seconds = 300
# Complete public API namespace routes to Rust; no dual backend remains.
path_prefixes = [
  "/puzzled.v1.AdminService",
  "/puzzled.v1.GamificationService",
  "/puzzled.v1.HealthService",
  "/puzzled.v1.JobsService",
  "/puzzled.v1.PreferencesService",
  "/puzzled.v1.PuzzleService",
  "/puzzled.v1.StatsService",
  "/healthz",
  "/readyz",
]
# Platform cron callbacks target the api JobsService (retention jobs); the web
# residual executor is deleted (ADR-170).
watch_paths = [
  "crates/puzzled-server/**",
  "crates/puzzled-core/**",
  "apps/puzzled/atlas/migrations/**",
  "Cargo.toml",
  "Cargo.lock",
  "sylphx.toml",
]

[services.health]
mode = "http"
# ADR-141 single path (api). Web uses per-service health.path = "/".
path = "/healthz"

[services.build]
strategy = "dockerfile"
dockerfile = "crates/puzzled-server/Dockerfile"
context = "."
